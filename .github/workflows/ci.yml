# Integración continua (S1-10): lint, reglas de importación, pruebas y build.
# El detalle de cada paso está en SPRINT-1/S1-10-gitflow-ci.md.
name: CI

on:
  push:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Reglas de importación (lint-imports)
        run: lint-imports

      - name: Pruebas y cobertura (pytest)
        run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22" # última 22.x, cumple engines.node >=22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Pruebas y cobertura (Vitest)
        run: npm run test:coverage

      - name: Build (Vite)
        run: npm run build
