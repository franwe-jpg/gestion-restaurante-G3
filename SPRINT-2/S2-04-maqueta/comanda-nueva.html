<option>Salón principal · Mesa 1 (2 pers.)</option>
<option>Salón principal · Mesa 10 (8 pers.)</option>

</select>

</div>
<div>
<label class="lbl" for="obs">Observaciones</label>
<textarea class="inp" id="obs" rows="2" style="resize: vertical">Milanesa sin jamón.</textarea>
</div>
</div>
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
<label style="position: relative; display: flex; align-items: center">
<span style="position: absolute; left: 12px; color: #64748b; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>

</div>

<!-- display: contents keeps each order line a direct flex item of this panel -->

<script>
(function () {
  // Sample catalog: [id, category, name, price].
  var prods = [
    ['mila', 'platos', 'Milanesa napolitana', 12500], ['ravi', 'platos', 'Ravioles de verdura', 9800],
    ['cesar', 'platos', 'Ensalada César', 7200], ['bife', 'platos', 'Bife de chorizo', 16900],
    ['flan', 'postres', 'Flan casero', 4200],
    ['agua', 'bebidas', 'Agua sin gas 500 ml', 1800], ['limo', 'bebidas', 'Limonada con menta', 3200],
    ['ejmd', 'menus', 'Ejecutivo del mediodía', 14900], ['ejpa', 'menus', 'Ejecutivo pastas', 11500],
    ['guiso', 'dia', 'Guiso de lentejas', 9900]
  ];
  var categorias = [['platos', 'Platos'], ['postres', 'Postres'], ['bebidas', 'Bebidas'], ['menus', 'Menús ejecutivos'], ['dia', 'Menú del día']];

  // items maps a product id to its quantity in the order.
  var state = { cat: 'platos', items: { mila: 2, agua: 2, flan: 1 } };

  var ICONO_MAS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>';
  var ICONO_BORRAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>';

  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) { return '$ ' + n.toLocaleString('es-AR'); }

  function poner(id, q) {
    if (q > 0) state.items[id] = q;
    else delete state.items[id];
  }

  function plantillaLinea(p, q) {
    return `<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9">
<div style="display: flex; justify-content: space-between; gap: 8px">
<span style="font-size: 14px; font-weight: 600">${esc(p[2])}</span>
<span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">${esc(fmt(q * p[3]))}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<div class="qty"><button type="button" aria-label="Restar uno" data-restar="${p[0]}">−</button><span>${q}</span><button type="button" aria-label="Sumar uno" data-sumar="${p[0]}">+</button></div>
<span style="font-size: 12px; color: #64748b">${esc(fmt(p[3]))} c/u</span>
<button type="button" class="ib del" aria-label="Quitar ${esc(p[2])}" data-quitar="${p[0]}">${ICONO_BORRAR}</button>
</div>
</div>`;
  }

  function render() {
    document.getElementById('categorias').innerHTML = categorias.map(function (c) {
      return `<button type="button" class="${c[0] === state.cat ? 'pill on' : 'pill'}" data-cat="${c[0]}">${esc(c[1])}</button>`;
    }).join('\n');
    document.getElementById('catalogo').innerHTML = prods.filter(function (p) { return p[1] === state.cat; }).map(function (p) {
      return `<div class="prod">
<div style="min-width: 0">
<div style="font-size: 14px; font-weight: 600">${esc(p[2])}</div>
<div style="font-size: 13px; color: #475569">${esc(fmt(p[3]))}</div>
</div>
<button type="button" class="add" aria-label="Agregar ${esc(p[2])}" data-agregar="${p[0]}">${ICONO_MAS}</button>
</div>`;
    }).join('\n');
    var total = 0, unidades = 0;
    var lineas = prods.filter(function (p) { return state.items[p[0]]; }).map(function (p) {
      var q = state.items[p[0]];
      total += q * p[3];
      unidades += q;
      return plantillaLinea(p, q);
    });
    document.getElementById('lineas').innerHTML = lineas.join('\n');
    document.getElementById('vacio').hidden = lineas.length > 0;
    document.getElementById('cant-items').textContent = unidades === 1 ? '1 ítem' : unidades + ' ítems';
    document.getElementById('total').textContent = fmt(total);
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-cat], [data-agregar], [data-sumar], [data-restar], [data-quitar]');
    if (!el) return;
    var id;
    if (el.hasAttribute('data-cat')) state.cat = el.getAttribute('data-cat');
    if ((id = el.getAttribute('data-agregar')) || (id = el.getAttribute('data-sumar'))) poner(id, (state.items[id] || 0) + 1);
    if ((id = el.getAttribute('data-restar'))) poner(id, state.items[id] - 1);
    if ((id = el.getAttribute('data-quitar'))) poner(id, 0);
    render();
  });

  render();
})();
</script>
</body>
