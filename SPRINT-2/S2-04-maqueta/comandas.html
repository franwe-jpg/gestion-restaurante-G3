<script>
(function () {
  var BADGES = { 'Abierta': 'bdg warn', 'Cerrada': 'bdg ok', 'Anulada': 'bdg err' };
  // Cell helpers: plain text, muted text, right-aligned number, bold text.
  function t(txt) { return { txt: txt, cls: '', td: '' }; }
  function m(txt) { return { txt: txt, cls: 'mut', td: '' }; }
  function n(txt) { return { txt: txt, cls: '', td: 'num' }; }
  function f(txt) { return { txt: txt, cls: 'fw', td: '' }; }

  // Sample orders: [number, table, date and time, shift, delivered, total, state].
  var comandas = [
    ['128', 'Salón principal · Mesa 2', '24/10 20:15', 'Noche', '4 de 6', '$ 37.000', 'Abierta'],
    ['129', 'Salón principal · Mesa 11', '24/10 20:30', 'Noche', '3 de 3', '$ 23.300', 'Abierta'],
    ['130', 'Salón principal · Mesa 4', '24/10 20:45', 'Noche', '1 de 4', '$ 30.000', 'Abierta'],
    ['131', 'Salón principal · Mesa 7', '24/10 21:05', 'Noche', '0 de 3', '$ 44.700', 'Abierta'],
    ['132', 'Terraza · Mesa 2', '24/10 21:10', 'Noche', '2 de 2', '$ 11.700', 'Abierta'],
    ['121', 'Salón principal · Mesa 5', '24/10 13:10', 'Almuerzo', '5 de 5', '$ 42.700', 'Cerrada'],
    ['122', 'Terraza · Mesa 1', '24/10 13:40', 'Almuerzo', '3 de 3', '$ 21.300', 'Cerrada'],
    ['124', 'Salón principal · Mesa 3', '24/10 14:05', 'Almuerzo', '0 de 2', '$ 8.400', 'Anulada']
  ];
  // Sample customers: [name, phone, reservations].
  var clientes = [
    ['María Pérez', '280 455-1020', '3'], ['Jorge Díaz', '280 433-8812', '1'], ['Lucía Sosa', '280 466-2301', '2'],
    ['Carlos Pérez', '280 421-7745', '5'], ['Valeria Gómez', '280 499-3110', '1']
  ];
  var filtros = [['Abierta', 'Abiertas'], ['Cerrada', 'Cerradas'], ['Anulada', 'Anuladas'], ['Todas', 'Todas']];

  var state = { tab: 'comandas', filtro: 'Abierta' };

  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function attrClase(cls) { return cls ? ` class="${cls}"` : ''; }

  // Builds the visible tab: title, description, columns and rows.
  function vista() {
    if (state.tab === 'clientes') {
      return {
        descripcion: 'Clientes registrados a partir de sus reservas.',
        columnas: [['Nombre', ''], ['Teléfono', ''], ['Reservas', 'num']],
        filas: clientes.map(function (c) { return { celdas: [f(c[0]), t(c[1]), n(c[2])], cerrable: false, etiqueta: 'Modificar cliente' }; })
      };
    }
    return {
      descripcion: '',
      columnas: [['N°', 'num'], ['Mesa', ''], ['Fecha y hora', ''], ['Turno', ''], ['Entregados', ''], ['Total', 'num'], ['Estado', '']],
      filas: comandas.filter(function (c) { return state.filtro === 'Todas' || c[6] === state.filtro; }).map(function (c) {
        return { celdas: [n(c[0]), f(c[1]), t(c[2]), m(c[3]), m(c[4]), n(c[5]), { txt: c[6], cls: BADGES[c[6]], td: '' }], cerrable: c[6] === 'Abierta', etiqueta: 'Ver comanda' };
      })
    };
  }

  function fila(r) {
    var tds = r.celdas.map(function (c) {
      return `<td${attrClase(c.td)}><span${attrClase(c.cls)}>${esc(c.txt)}</span></td>`;
    }).join('');
    var cerrar = r.cerrable ? '<button type="button" class="btn bo" style="min-height: 34px; padding: 0 12px; font-size: 13px">Cerrar</button>' : '';
    return `<tr>
${tds}
<td style="text-align: right; white-space: nowrap">
${cerrar}
<button type="button" class="ib" aria-label="${esc(r.etiqueta)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></button>
</td>
</tr>`;
  }

  function render() {
    var v = vista();
    var enComandas = state.tab === 'comandas';
    document.getElementById('tabs').innerHTML = [['comandas', 'Comandas'], ['clientes', 'Clientes']].map(function (k) {
      return `<button type="button" role="tab" class="${k[0] === state.tab ? 'tb on' : 'tb'}" data-tab="${k[0]}">${k[1]}</button>`;
    }).join('\n');
    document.getElementById('descripcion').textContent = v.descripcion;
    document.getElementById('nueva-comanda').hidden = !enComandas;
    document.getElementById('filtros-comandas').hidden = !enComandas;
    document.getElementById('filtros-clientes').hidden = enComandas;
    document.getElementById('filtros-estado').innerHTML = filtros.map(function (x) {
      return `<button type="button" class="${x[0] === state.filtro ? 'sg on' : 'sg'}" data-filtro="${x[0]}">${x[1]}</button>`;
    }).join('\n');
    document.getElementById('columnas').innerHTML = v.columnas.map(function (c) {
      return `<th${attrClase(c[1])}>${esc(c[0])}</th>`;
    }).join('') + '\n<th><span style="position: absolute; left: -9999px">Acciones</span></th>';
    document.getElementById('filas').innerHTML = v.filas.map(fila).join('\n');
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-tab], [data-filtro]');
    if (!el) return;
    if (el.hasAttribute('data-tab')) state.tab = el.getAttribute('data-tab');
    if (el.hasAttribute('data-filtro')) state.filtro = el.getAttribute('data-filtro');
    render();
  });

  render();
})();
</script>
