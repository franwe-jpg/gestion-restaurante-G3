[[tool.importlinter.contracts]]
name = "repository no importa router ni service (S0-05, 3.3)"
type = "forbidden"
source_modules = ["app.modules.*.repository"]
forbidden_modules = ["app.modules.*.router", "app.modules.*.service"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
