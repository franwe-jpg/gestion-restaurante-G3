<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Gestión de Restaurante</title>
    <meta
      name="description"
      content="Sistema de gestión de restaurante: productos, menús, salón, atención, reservas y pagos."
    />
    <meta property="og:title" content="Sistema de Gestión de Restaurante" />
    <meta
      property="og:description"
      content="Sistema de gestión de restaurante: productos, menús, salón, atención, reservas y pagos."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello claro.
      (() => {
        try {
          const guardado = localStorage.getItem('gestion-restaurante.tema');
          const prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (guardado === 'oscuro' || (guardado === null && prefiereOscuro)) {
            document.documentElement.classList.add('dark');
          }
        } catch {
          /* Sin acceso a localStorage: se queda en claro. */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-100 selection:text-amber-900 font-sans"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
